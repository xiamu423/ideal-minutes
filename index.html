<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>拼一份理想的纪要</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
<style>
:root {
  --blue: #0082ef;
  --blue-weak: #e8f3fe;
  --text: #1f2329;
  --text-2: #646a73;
  --text-3: #8f959e;
  --line: #e5e6eb;
  --bg: #f4f5f7;
  --card: #ffffff;
  --red: #e5484d;
  --orange: #f08c00;
  --green: #2ba471;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: 15px; }

/* ---------- 通用页面 ---------- */
.page { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
.page h1 { font-size: 22px; margin: 0 0 6px; }
.page .sub { color: var(--text-2); margin: 0 0 24px; }
.step-tag { display: inline-block; font-size: 12px; color: var(--blue); background: var(--blue-weak); padding: 2px 8px; border-radius: 999px; margin-bottom: 10px; }
.field { margin-bottom: 18px; }
.field label.lbl { display: block; font-weight: 600; margin-bottom: 8px; }
.field input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.opts { display: grid; gap: 10px; }
.opts.cols-2 { grid-template-columns: 1fr 1fr; }
.opt {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--line);
  border-radius: var(--radius); background: #fff; text-align: left; color: var(--text);
}
.opt:hover { border-color: #b8d9fb; }
.opt.on { border-color: var(--blue); background: var(--blue-weak); }
.opt .ico { font-size: 26px; }
.opt .t { font-weight: 600; }
.opt .d { font-size: 13px; color: var(--text-2); }
.btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:disabled { background: #a6cff7; border-color: #a6cff7; cursor: not-allowed; }
.btn.ghost { border: none; background: none; color: var(--text-2); padding: 6px 8px; }
.btn.block { width: 100%; padding: 13px; font-size: 16px; }
.actions-row { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--text-3); }
.notice { background: #fff8e6; border: 1px solid #f5d98b; color: #7a5800; border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.qr-box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; background: #fff; border-radius: var(--radius); border: 1px solid var(--line); margin: 16px 0; }
.qr-box img { width: 200px; height: 200px; image-rendering: pixelated; }
.qr-box .url { font-size: 12px; color: var(--text-2); word-break: break-all; text-align: center; }
.link { color: var(--blue); background: none; border: none; padding: 0; text-decoration: underline; }

/* ---------- 组合页 ---------- */
.compose { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.topbar {
  flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff;
  border-bottom: 1px solid var(--line); z-index: 5;
}
.topbar .ttl { font-weight: 600; flex: 1; min-width: 0; }
.topbar .ttl small { display: block; font-weight: 400; color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.workspace { flex: 1; display: flex; min-height: 0; }
.library {
  width: 340px; flex: none; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
}
.library .lib-head { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
.library .lib-head b { font-size: 15px; }
.library .lib-head .hint { margin-top: 2px; }
.cat-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cat-filter button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--text-2); }
.cat-filter button.on { border-color: var(--blue); color: var(--blue); background: var(--blue-weak); }
.lib-list { flex: 1; overflow-y: auto; padding: 10px 12px 40px; display: flex; flex-direction: column; gap: 10px; }
.lib-empty { color: var(--text-3); text-align: center; font-size: 13px; padding: 30px 0; }

.canvas-wrap { flex: 1; overflow-y: auto; padding: 24px 24px 120px; }
.doc { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); padding: 28px 28px 40px; min-height: 60vh; }
.doc-title { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
.doc-meta { font-size: 12.5px; color: var(--text-3); margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.canvas-list { min-height: 200px; display: flex; flex-direction: column; gap: 6px; }
.canvas-empty {
  border: 2px dashed #cfd6df; border-radius: 10px; color: var(--text-3); text-align: center; padding: 40px 16px; font-size: 14px;
}
.canvas-list:not(:empty) + .canvas-empty { display: none; }

/* 模块卡（库） */
.lib-card {
  border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; cursor: grab; position: relative; flex: none;
}
.canvas-list > .mod { flex: none; }
.lib-card:hover { border-color: #b8d9fb; box-shadow: 0 2px 8px rgba(0,130,239,.08); }
.lib-card .lc-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #f0f1f3; background: #fafbfc; }
.lib-card .lc-name { flex: 1; font-weight: 600; font-size: 13.5px; }
.cat { font-size: 11px; padding: 0 6px; border-radius: 4px; line-height: 18px; flex: none; }
.cat-总览 { background: #e8f3fe; color: #0b6bcb; }
.cat-结构 { background: #e9f7ef; color: #1e7f4f; }
.cat-人物 { background: #f3edfd; color: #6b3fc9; }
.cat-视觉 { background: #fff1e6; color: #b85c00; }
.cat-交互 { background: #fdecef; color: #c0284a; }
.cat-自定义 { background: #f0f1f3; color: #555; }
.add-btn { border: none; background: var(--blue); color: #fff; width: 26px; height: 26px; border-radius: 50%; font-size: 18px; line-height: 26px; padding: 0; flex: none; }
.lib-card .lc-body { padding: 10px 12px; max-height: 128px; overflow: hidden; position: relative; font-size: 13px; pointer-events: none; }
.lib-card .lc-body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, #fff); }
.lib-card.expanded .lc-body { max-height: none; }
.lib-card.expanded .lc-body::after { display: none; }
.lc-toggle { font-size: 12px; color: var(--blue); background: none; border: none; padding: 4px 12px 8px; display: block; }

/* 模块卡（纪要内） */
.mod { position: relative; border-radius: 8px; border: 1px solid transparent; padding: 6px 8px 10px; }
.mod:hover { border-color: #e1e8f0; background: #fcfdff; }
.mod .mod-bar { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); margin-bottom: 4px; min-height: 26px; }
.mod .handle { cursor: grab; padding: 2px 6px; border-radius: 4px; font-size: 16px; color: #9aa3ad; touch-action: none; user-select: none; letter-spacing: -2px; }
.mod .handle:active { cursor: grabbing; }
.mod .mod-label { flex: 1; }
.mod .mod-tools { display: flex; gap: 2px; }
.mod .mod-tools button { border: none; background: none; color: var(--text-3); font-size: 12px; padding: 3px 6px; border-radius: 4px; }
.mod .mod-tools button:hover { background: #f0f1f3; color: var(--text); }
.mod .note-view { margin-top: 6px; font-size: 12.5px; color: #7a5800; background: #fff8e6; border-radius: 6px; padding: 6px 10px; }
.sortable-ghost { opacity: .35; background: var(--blue-weak) !important; border: 1px dashed var(--blue) !important; }
.sortable-chosen { box-shadow: 0 6px 18px rgba(0,0,0,.12); }

/* 手机端布局 */
.fab {
  position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20; background: var(--blue); color: #fff; border: none;
  border-radius: 999px; padding: 12px 18px; font-size: 15px; box-shadow: 0 4px 14px rgba(0,130,239,.35); display: none;
}
.sheet-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: none; }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 60; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

@media (max-width: 820px) {
  .page { padding: 24px 16px 60px; }
  .opts.cols-2 { grid-template-columns: 1fr; }
  .canvas-wrap { padding: 0 0 110px; }
  .doc { border-radius: 0; box-shadow: none; padding: 18px 14px 30px; min-height: calc(100dvh - 60px); }
  .doc-title { font-size: 19px; }
  .library {
    position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: 78vh; height: 78dvh; z-index: 40; border-radius: 16px 16px 0 0;
    border-right: none; transform: translateY(102%); transition: transform .25s ease; box-shadow: 0 -6px 24px rgba(0,0,0,.15);
  }
  .library.open { transform: translateY(0); }
  .library .lib-head { position: relative; padding-top: 18px; }
  .library .lib-head::before { content: ""; position: absolute; top: 7px; left: 50%; width: 36px; height: 4px; margin-left: -18px; background: #d5d8dd; border-radius: 2px; }
  .sheet-close { position: absolute; right: 10px; top: 10px; }
  .fab { display: block; }
  .sheet-mask.open { display: block; }
  .lib-card { cursor: default; }
  .mod { padding: 4px 2px 10px; }
  .mod .mod-tools button { font-size: 13px; padding: 4px 8px; }
  .topbar { padding: 8px 12px; }
}
@media (min-width: 821px) { .sheet-close { display: none; } }

/* ---------- 模块内容渲染 ---------- */
.m-h { font-size: 15px; font-weight: 700; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.m-h .em { font-size: 15px; }
.m-conclusion { background: linear-gradient(90deg, #eef6ff, #f7fbff); border-left: 4px solid var(--blue); border-radius: 6px; padding: 10px 14px; font-weight: 600; }
.m-cover { background: linear-gradient(135deg, #0a6fd6, #3aa0ff 60%, #7cc4ff); color: #fff; border-radius: 12px; padding: 18px; }
.m-cover .cv-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.m-cover .cv-tags span { font-size: 11px; background: rgba(255,255,255,.22); padding: 1px 8px; border-radius: 999px; }
.m-cover .cv-title { font-size: 19px; font-weight: 700; margin-bottom: 12px; }
.m-cover .cv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.m-cover .cv-grid div { background: rgba(255,255,255,.16); border-radius: 8px; padding: 8px; }
.m-cover .cv-grid small { display: block; font-size: 11px; opacity: .85; }
.m-cover .cv-grid b { font-size: 14px; }
@media (max-width: 520px) { .m-cover .cv-grid { grid-template-columns: repeat(2, 1fr); } }
ul.m-list { margin: 0; padding-left: 20px; }
ul.m-list li { margin: 2px 0; }
.m-topic { margin-bottom: 8px; }
.m-topic b { display: block; }
.m-topic span { color: var(--text-2); }
.m-decision { display: flex; gap: 8px; margin: 4px 0; }
.m-decision::before { content: "✔"; color: var(--green); font-weight: 700; }
table.m-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.m-table th, table.m-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.m-table th { background: #f6f7f9; font-weight: 600; white-space: nowrap; }
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.todo-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #edf0f2; }
.todo-row:last-child { border-bottom: none; }
.todo-row .box { width: 15px; height: 15px; border: 1.5px solid #b5bcc5; border-radius: 3px; margin-top: 4px; flex: none; }
.todo-row .w { flex: 1; }
.todo-row .who { color: var(--blue); font-weight: 600; margin-right: 4px; }
.todo-row .due { color: var(--orange); font-size: 12.5px; white-space: nowrap; }
.risk { display: flex; gap: 8px; margin: 4px 0; align-items: flex-start; }
.risk .lv { font-size: 11px; border-radius: 4px; padding: 0 6px; line-height: 20px; flex: none; margin-top: 2px; }
.risk .lv.高 { background: #fdecec; color: var(--red); }
.risk .lv.中 { background: #fff3e0; color: var(--orange); }
.spk { display: flex; gap: 10px; margin-bottom: 10px; }
.spk .av { width: 32px; height: 32px; border-radius: 50%; background: #dbeafe; color: #1e5bb8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
.spk .nm { font-weight: 600; }
.spk .nm small { color: var(--text-3); font-weight: 400; margin-left: 6px; }
.spk ul { margin: 2px 0 0; padding-left: 18px; color: var(--text-2); font-size: 14px; }
.quote { border-left: 3px solid #d0d7e0; padding: 2px 12px; margin: 8px 0; color: #3a3f45; }
.quote .src { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }
.quote .src a { color: var(--blue); text-decoration: none; }

.bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.bar-row .bl { width: 76px; flex: none; color: var(--text-2); text-align: right; }
.bar-row .bt { flex: 1; height: 18px; background: #f1f3f5; border-radius: 4px; position: relative; }
.bar-row .bf { height: 100%; border-radius: 4px; background: #5aaaf5; }
.bar-row.total .bf { background: var(--blue); }
.bar-row .bv { width: 52px; flex: none; font-weight: 600; }
.bar-row .ref { position: absolute; top: -4px; bottom: -4px; border-left: 2px dashed var(--red); }
.chart-note { font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
.chart-note .refl { color: var(--red); }
.funnel-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-size: 13px; }
.funnel-row .fl { width: 96px; flex: none; text-align: right; color: var(--text-2); }
.funnel-row .ft { flex: 1; display: flex; justify-content: center; }
.funnel-row .ff { height: 24px; background: linear-gradient(90deg, #4c9df0, #2b7fe0); color: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; min-width: 34px; }
.pie-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.pie { width: 120px; height: 120px; border-radius: 50%; flex: none; }
.legend div { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 3px 0; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.radar-wrap svg { width: 100%; max-width: 300px; display: block; margin: 0 auto; }

.tl { display: flex; position: relative; padding-top: 6px; }
.tl::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: #cfe3f8; }
.tl-item { flex: 1; position: relative; padding-top: 18px; text-align: center; font-size: 12.5px; padding-left: 2px; padding-right: 2px; }
.tl-item::before { content: ""; position: absolute; top: 2px; left: 50%; margin-left: -6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2.5px solid var(--blue); }
.tl-item b { display: block; color: var(--blue); font-size: 13px; }
.tl-item span { color: var(--text-2); }
@media (max-width: 520px) {
  .tl { flex-direction: column; padding-left: 18px; padding-top: 0; }
  .tl::before { left: 5px; right: auto; top: 4px; bottom: 4px; width: 2px; height: auto; }
  .tl-item { text-align: left; padding: 2px 0 10px 8px; }
  .tl-item::before { left: -18px; top: 6px; margin-left: 0; }
  .tl-item b { display: inline; margin-right: 8px; }
}
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow .st { background: #eef6ff; border: 1px solid #b8d9fb; color: #0b5cad; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.flow .ar { color: #8fb8e6; font-weight: 700; }
.rel { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rel .tier { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.rel .node { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; text-align: center; min-width: 96px; background: #fff; font-size: 13px; }
.rel .node b { display: block; }
.rel .node small { color: var(--text-3); display: block; font-size: 11.5px; }
.rel .node .tg { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: #f0f1f3; color: #555; margin-top: 2px; }
.rel .node .tg.关键人 { background: #fdecec; color: var(--red); }
.rel .node .tg.支持者 { background: #e9f7ef; color: var(--green); }
.rel .down { color: #b5bcc5; font-size: 14px; line-height: 16px; }
.photo svg { width: 100%; max-width: 420px; height: auto; display: block; border-radius: 6px; }
.photo .cap { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.tr-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fafbfc; }
.tr-box .tr-line { font-size: 13px; color: var(--text-2); margin: 2px 0; }
.tr-box .tr-line b { color: var(--blue); font-weight: 500; margin-right: 6px; }
.tr-box .tr-more { font-size: 13px; color: var(--blue); margin-top: 4px; }
.qa-input { display: flex; align-items: center; gap: 8px; border: 1px solid #b8d9fb; border-radius: 999px; padding: 7px 14px; color: var(--text-3); font-size: 13.5px; background: #fff; }
.qa-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.qa-chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; font-size: 12.5px; padding: 3px 10px; color: var(--text-2); }
.qa-chips button.on { border-color: var(--blue); color: var(--blue); }
.qa-ans { margin-top: 8px; background: #f3f8ff; border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
.act-row { display: flex; gap: 8px; flex-wrap: wrap; }
.act-row span { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; background: #fff; }
.custom-ta { width: 100%; min-height: 70px; border: 1px dashed #b5bcc5; border-radius: 8px; padding: 8px 10px; resize: vertical; background: #fcfcfd; }

/* ---------- 结果页 ---------- */
.result-sum { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; font-size: 14px; white-space: pre-wrap; line-height: 1.7; }
.preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 820px) { .preview-grid { grid-template-columns: 1fr; } }
.preview-grid h3 { font-size: 14px; margin: 0 0 8px; color: var(--text-2); }
.preview-grid .doc { padding: 16px; min-height: 0; }
.preview-grid .mod .mod-bar { display: none; }
.page.wide { max-width: 1200px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
.admin-table th, .admin-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.admin-table th { background: #f6f7f9; }

/* 备注弹层 */
.dlg-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: #fff; border-radius: 12px; width: 100%; max-width: 420px; padding: 18px; }
.dlg h4 { margin: 0 0 4px; }
.dlg textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.dlg .quick { display: flex; gap: 6px; flex-wrap: wrap; }
.dlg .quick button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--text-2); }

/* ---------- v2：多选、结果卡、导出图片、研究员页 ---------- */
.opt .chk { width: 18px; height: 18px; border: 1.5px solid #b5bcc5; border-radius: 4px; flex: none; position: relative; background: #fff; }
.opt.on .chk { background: var(--blue); border-color: var(--blue); }
.opt.on .chk::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.page h3 { font-size: 16px; margin: 28px 0 8px; }
.send-box { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.rc-label { color: var(--text-2); font-size: 14px !important; }
.rc { background: #f4f5f7; padding: 14px; border-radius: 12px; border: 1px solid var(--line); }
.rc-head { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.rc-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.rc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rc-chips span { font-size: 12px; background: #f0f2f5; color: #454c55; border-radius: 6px; padding: 2px 8px; }
.rc-send { margin-top: 10px; font-size: 14px; }
.rc .rc-doc { min-height: 0 !important; border-radius: 10px !important; box-shadow: none; padding: 16px !important; }
.rc .mod { padding: 4px 0 10px; border: none; }
.rc .mod:hover { background: none; }
.rc-idx { font-size: 11.5px; color: var(--text-3); margin-bottom: 4px; }
.rc-foot { background: #fff; border-radius: 10px; padding: 12px 16px; margin-top: 10px; font-size: 13.5px; }
.rc-tag { display: inline-block; font-size: 12px; background: #f0f2f5; color: #6b727b; border-radius: 4px; padding: 0 6px; margin: 2px 4px 2px 0; text-decoration: line-through; }
.rc-id { margin-top: 10px; font-size: 11.5px; color: var(--text-3); }
.img-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 12px; }
.img-panel { background: #fff; border-radius: 12px; width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; padding: 12px; }
.img-tip { font-size: 14px; background: #eef6ff; color: #0b5cad; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.img-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 8px; }
.img-scroll img { width: 100%; display: block; -webkit-touch-callout: default; }
.admin-row { display: flex; gap: 8px; flex-wrap: wrap; }
.admin-row input, .admin-row select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.page .url { font-size: 12px; color: var(--text-2); word-break: break-all; }

</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

<script>
/* 模块渲染器：renderBody(模块, 场景, 当前作答数据) */
(function () {
  "use strict";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const PALETTE = ["#2b7fe0", "#f08c00", "#8e6ad8", "#2ba471", "#e5484d", "#13a8a8"];
  const H = (txt, em) => `<div class="m-h">${em ? `<span class="em">${em}</span>` : ""}${esc(txt)}</div>`;

  function renderBody(m, ctx, W) {
    const d = m.data;
    switch (m.type) {
      case "conclusion": return `<div class="m-conclusion">💡 ${esc(d.text)}</div>`;
      case "cover":
        return `<div class="m-cover"><div class="cv-tags">${d.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
          <div class="cv-title">${esc(d.title)}</div>
          <div class="cv-grid">${d.points.map((p) => `<div><small>${esc(p[0])}</small><b>${esc(p[1])}</b></div>`).join("")}</div></div>`;
      case "bullets": return H("要点摘要", "📌") + `<ul class="m-list">${d.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
      case "topics": return H("议题小结", "🗂") + d.items.map((i, k) => `<div class="m-topic"><b>${k + 1}. ${esc(i.title)}</b><span>${esc(i.text)}</span></div>`).join("");
      case "decisions": return H("决策与结论", "✅") + d.items.map((i) => `<div class="m-decision"><span>${esc(i)}</span></div>`).join("");
      case "todos": return H("待办事项", "📋") + d.items.map((i) => `<div class="todo-row"><span class="box"></span><span class="w"><span class="who">@${esc(i.who)}</span>${esc(i.what)}</span><span class="due">${esc(i.due)}</span></div>`).join("");
      case "risks": return H(m.name, "⚠️") + d.items.map((i) => `<div class="risk"><span class="lv ${esc(i.level)}">${esc(i.level)}</span><span>${esc(i.text)}</span></div>`).join("");
      case "speakers": return H("发言人观点", "🗣") + d.items.map((i) => `<div class="spk"><div class="av">${esc(i.name.slice(0, 1))}</div><div><div class="nm">${esc(i.name)}<small>${esc(i.role)}</small></div><ul>${i.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div></div>`).join("");
      case "quotes": return H("金句原话", "❝") + d.items.map((i) => `<div class="quote">“${esc(i.text)}”<span class="src">—— ${esc(i.who)} · <a href="javascript:void(0)">${esc(i.time)} ▶</a></span></div>`).join("");
      case "bar": {
        const vals = d.items.map((i) => i.value).concat([d.total || 0, d.ref ? d.ref.value : 0]);
        const max = Math.max.apply(null, vals) * 1.08;
        const refPos = d.ref ? (d.ref.value / max) * 100 : null;
        const row = (label, v, cls) => `<div class="bar-row ${cls || ""}"><span class="bl">${esc(label)}</span><span class="bt"><span class="bf" style="width:${(v / max) * 100}%;display:block"></span>${refPos != null ? `<span class="ref" style="left:${refPos}%"></span>` : ""}</span><span class="bv">${v}${esc(d.unit)}</span></div>`;
        return H(d.title, "📊") + d.items.map((i) => row(i.label, i.value)).join("") + (d.total ? row("合计", d.total, "total") : "") +
          `<div class="chart-note">${d.ref ? `<span class="refl">┆ ${esc(d.ref.label)} ${d.ref.value}${esc(d.unit)}</span>　` : ""}${esc(d.note || "")}</div>`;
      }
      case "funnel": {
        const max = d.items[0].value;
        return H(d.title, "📉") + d.items.map((i) => `<div class="funnel-row"><span class="fl">${esc(i.label)}</span><span class="ft"><span class="ff" style="width:${Math.max(12, (i.value / max) * 100)}%">${i.value}%</span></span></div>`).join("");
      }
      case "pie": {
        const total = d.items.reduce((a, b) => a + b.value, 0); let acc = 0;
        const stops = d.items.map((i, k) => { const s = acc; acc += (i.value / total) * 360; return `${PALETTE[k % PALETTE.length]} ${s}deg ${acc}deg`; }).join(",");
        return H(d.title, "🥧") + `<div class="pie-wrap"><div class="pie" style="background:conic-gradient(${stops})"></div><div class="legend">${d.items.map((i, k) => `<div><i style="background:${PALETTE[k % PALETTE.length]}"></i>${esc(i.label)} <b>${i.value}%</b></div>`).join("")}</div></div>`;
      }
      case "radar": {
        const n = d.items.length, cx = 150, cy = 125, r = 82;
        const pt = (k, v) => { const a = -Math.PI / 2 + (k * 2 * Math.PI) / n; return [cx + Math.cos(a) * r * v, cy + Math.sin(a) * r * v]; };
        let rings = ""; for (let l = 1; l <= d.max; l++) rings += `<polygon points="${d.items.map((_, k) => pt(k, l / d.max).join(",")).join(" ")}" fill="none" stroke="#e3e7ec"/>`;
        const axes = d.items.map((_, k) => `<line x1="${cx}" y1="${cy}" x2="${pt(k, 1)[0]}" y2="${pt(k, 1)[1]}" stroke="#e3e7ec"/>`).join("");
        const poly = `<polygon points="${d.items.map((i, k) => pt(k, i.value / d.max).join(",")).join(" ")}" fill="rgba(0,130,239,.22)" stroke="#0082ef" stroke-width="2"/>`;
        const labels = d.items.map((i, k) => { const [x, y] = pt(k, 1.22); return `<text x="${x}" y="${y}" font-size="11.5" text-anchor="middle" dominant-baseline="middle" fill="#46505c">${esc(i.label)} ${i.value}</text>`; }).join("");
        return H(d.title, "🕸") + `<div class="radar-wrap"><svg viewBox="0 0 300 250">${rings}${axes}${poly}${labels}</svg></div>`;
      }
      case "table": return H(d.title, "▦") + `<div class="tbl-scroll"><table class="m-table"><thead><tr>${d.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${d.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      case "timeline": return H(d.title, "🕒") + `<div class="tl">${d.items.map((i) => `<div class="tl-item"><b>${esc(i.date)}</b><span>${esc(i.text)}</span></div>`).join("")}</div>`;
      case "flow": return H(d.title, "🔀") + `<div class="flow">${d.steps.map((s) => `<span class="st">${esc(s)}</span>`).join('<span class="ar">→</span>')}</div>`;
      case "relation": return H(d.title, "🧭") + `<div class="rel">${d.tiers.map((tier) => `<div class="tier">${tier.map((n) => `<div class="node"><b>${esc(n.name)}</b><small>${esc(n.role)}</small><span class="tg ${esc(n.tag)}">${esc(n.tag)}</span></div>`).join("")}</div>`).join('<div class="down">▲</div>')}</div>`;
      case "photo": return H("现场照片", "📷") + `<div class="photo">${d.svg}<div class="cap">${esc(d.caption)}</div></div>`;
      case "transcript": return H("逐字稿", "📝") + `<div class="tr-box"><div class="hint">录音时长 ${esc(d.duration)}</div>${d.items.map((i) => `<div class="tr-line"><b>${esc(i.time)}</b>${esc(i.who)}：${esc(i.text)}</div>`).join("")}<div class="tr-more">查看完整逐字稿 ›</div></div>`;
      case "qa": {
        const open = ctx === "canvas" && W && W.qaOpen ? W.qaOpen : {};
        return H("问问这场会", "✨") + `<div class="qa-input">🔍 想了解这场会的什么？</div><div class="qa-chips">${d.items.map((i, k) => `<button class="no-drag qa-chip ${open[k] ? "on" : ""}" data-k="${k}">${esc(i.q)}</button>`).join("")}</div>` +
          d.items.map((i, k) => (open[k] ? `<div class="qa-ans"><b>AI：</b>${esc(i.a)}</div>` : "")).join("");
      }
      case "actions": return H("后续动作", "⚡") + `<div class="act-row">${d.items.map((i) => `<span>${esc(i)}</span>`).join("")}</div>`;
      case "custom": {
        const val = W && W.custom && typeof W.custom === "object" ? W.custom[m.id] || "" : "";
        if (ctx === "canvas") return H("我的补充", "✏️") + `<textarea class="custom-ta no-drag" placeholder="写下您希望纪要里出现、但上面没有的内容……">${esc(val)}</textarea>`;
        return H("我的补充", "✏️") + `<div class="hint">${val ? esc(val) : "放入纪要后，可以写下您希望出现、但素材里没有的内容"}</div>`;
      }
    }
    return "";
  }

  window.renderBody = renderBody; window.esc = esc;
})();

  function toResult(s) {
    const w = s.work;
    return { v: 2, id: s.id, p: s.pid, g: s.group, ud: s.usualDevice, ad: s.actualDevice, mm: s.deviceMismatch ? 1 : 0,
      th: s.themeId, o: w.order, n: w.notes, c: Object.fromEntries(w.order.filter(isCustom).map((id) => [id, (w.custom || {})[id] || ""])), r: s.recipients, ro: s.recipientOther || "", cm: s.comment || "",
      sec: Math.round(((w.endedAt || now()) - w.startedAt) / 1000), qa: w.events.filter((e) => e.action === "qa_click").length,
      mv: w.events.filter((e) => e.action === "move").length, ft: s.finishedAt || now(), vp: s.viewport };
  }
  function encodeResult(r) { return CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(r)))); }
  function decodeAll(text) {
    const out = []; const re = /IM2:([A-Za-z0-9+/=]+)/g; let m;
    while ((m = re.exec(text.replace(/\s+/g, "")))) { try { out.push(JSON.parse(decodeURIComponent(escape(atob(m[1]))))); } catch (e) { /* 忽略损坏的结果码 */ } }
    return out;
  }
  function resultText(r) {
    const t = themeOf(r.th); const nm = (id) => (t.modules.find((m) => m.id === id) || {}).name || id;
    const lines = [`【理想纪要调研结果】${r.p}`,
      `平时用：${groupOf(r.g).label}｜平时看纪要设备：${r.ud}｜作答设备：${r.ad}${r.mm ? "（不一致）" : ""}`,
      `主题：${t.name}｜用时：${fmtDur(r.sec)}`,
      `会发给：${r.r.join("、")}${r.ro ? "（" + r.ro + "）" : ""}`, "我的纪要顺序："];
    r.o.forEach((id, i) => lines.push(isCustom(id) ? `${i + 1}. ✏️ 空白卡：${customOf(r, id) || "（未填写）"}${r.n[id] ? "　💬" + r.n[id] : ""}` : `${i + 1}. ${nm(id)}${r.n[id] ? "　💬" + r.n[id] : ""}`));
    if (r.cm) lines.push(`其他想法：${r.cm}`);
    lines.push("", "（以下结果码供研究员导入，请一并发送）", encodeResult(r));
    return lines.join("\n");
  }

  async function makeImage(el) {
    const opts = { scale: 2, backgroundColor: "#f4f5f7", width: el.offsetWidth, font: false };
    // Safari 首次渲染可能缺内容，先预热一次
    try { await modernScreenshot.domToPng(el, Object.assign({}, opts, { scale: 0.2 })); } catch (e) { /* ignore */ }
    return modernScreenshot.domToPng(el, opts);
  }
  function showImage(dataUrl, fileName) {
    const isM = detectDevice() !== "电脑";
    const wrap = document.createElement("div"); wrap.className = "img-mask";
    wrap.innerHTML = `<div class="img-panel">
      <div class="img-tip">${isM ? "👇 <b>长按图片</b>，选择“保存图片”或“发送给朋友”，发给研究员即可" : "图片已生成，点击下载后发给研究员即可"}</div>
      <div class="img-scroll"><img src="${dataUrl}" alt="结果图片"/></div>
      <div class="actions-row" style="justify-content:center;margin-top:10px">
        ${isM && !inWeChat() ? `<button class="btn" data-x="share">分享/保存</button>` : ""}
        <button class="btn ${isM ? "" : "primary"}" data-x="dl">下载图片</button>
        <button class="btn ghost" data-x="close">关闭</button></div></div>`;
    document.body.appendChild(wrap);
    wrap.onclick = async (e) => {
      const x = e.target.dataset.x;
      if (e.target === wrap || x === "close") wrap.remove();
      if (x === "dl") { const blob = await (await fetch(dataUrl)).blob(); download(fileName, blob); }
      if (x === "share") {
        try { const blob = await (await fetch(dataUrl)).blob(); const file = new File([blob], fileName, { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: "理想纪要调研结果" });
          else toast("当前浏览器不支持，请长按图片保存");
        } catch (err) { /* 用户取消 */ }
      }
    };
  }

  function renderLists() {
    const t = themeOf(S.themeId), w = W();
    const modById = (id) => t.modules.find((m) => m.id === id);
    const canvas = document.getElementById("canvas"), libList = document.getElementById("libList");
    if (!canvas) return;
    canvas.innerHTML = w.order.map((id) => { const m = modById(id); const note = w.notes[id];
      return `<div class="mod" data-id="${id}">
        <div class="mod-bar"><span class="handle" title="拖动调整顺序">⋮⋮</span><span class="mod-label">${esc(m.name)}</span>
          <span class="mod-tools"><button class="no-drag" data-act="note" title="备注">💬</button><button class="no-drag" data-act="remove" title="移出">✕</button></span></div>
        ${renderBody(m, "canvas", w)}${note ? `<div class="note-view">💬 ${esc(note)}</div>` : ""}</div>`; }).join("");
    const freeCustom = t.modules.filter((m) => isCustom(m.id) && !w.order.includes(m.id));
    const rest = t.modules.filter((m) => !w.order.includes(m.id) && (libFilter === "全部" || m.cat === libFilter) && (!isCustom(m.id) || m.id === (freeCustom[0] || {}).id));
    libList.innerHTML = rest.length ? rest.map((m) => `<div class="lib-card" data-id="${m.id}">
        <div class="lc-head"><span class="cat cat-${m.cat}">${m.cat}</span><span class="lc-name">${esc(m.name)}${isCustom(m.id) ? `<small class="hint">　还剩 ${freeCustom.length} 张，可插入任意位置</small>` : ""}</span><button class="add-btn no-drag" data-act="add" title="加入纪要">＋</button></div>
        <div class="lc-body">${renderBody(m, "lib", w)}</div><button class="lc-toggle no-drag" data-act="toggle">展开预览</button></div>`).join("")
      : `<div class="lib-empty">${libFilter === "全部" ? "模块都已放入纪要" : "该类别的模块都已放入纪要"}</div>`;
    document.getElementById("cnt").textContent = w.order.length;

    canvas.querySelectorAll("[data-act=remove]").forEach((b) => b.onclick = async () => { const id = b.closest(".mod").dataset.id; if (isCustom(id) && w.custom[id] && !(await ask("移出后，这张空白卡里写的内容会清空，确定吗？", "移出", true))) return; w.order = w.order.filter((x) => x !== id); if (isCustom(id)) { delete w.custom[id]; delete w.notes[id]; } log("remove", { id, method: "tap" }); save(); renderLists(); toast("已移回模块库"); });
    canvas.querySelectorAll("[data-act=note]").forEach((b) => b.onclick = () => openNote(b.closest(".mod").dataset.id));
    canvas.querySelectorAll(".qa-chip").forEach((b) => b.onclick = () => { const k = b.dataset.k; w.qaOpen[k] = !w.qaOpen[k]; log("qa_click", { k }); save(); renderLists(); });
    canvas.querySelectorAll(".custom-ta").forEach((ta) => { const id = ta.closest(".mod").dataset.id;
      ta.oninput = () => { w.custom[id] = ta.value; save(); }; ta.onchange = () => log("custom_edit", { id, len: ta.value.length }); });
    libList.querySelectorAll("[data-act=add]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); const id = b.closest(".lib-card").dataset.id; w.order.push(id); log("add", { id, index: w.order.length - 1, method: "tap" }); save(); renderLists(); toast("已加入纪要末尾"); });
    libList.querySelectorAll(".lib-card").forEach((c) => {
      const tg = c.querySelector("[data-act=toggle]");
      const flip = () => { c.classList.toggle("expanded"); tg.textContent = c.classList.contains("expanded") ? "收起预览" : "展开预览"; if (c.classList.contains("expanded")) log("preview", { id: c.dataset.id }); };
      tg.onclick = (e) => { e.stopPropagation(); flip(); };
      if (mobileLayout.matches) c.querySelector(".lc-head").onclick = (e) => { if (!e.target.closest("[data-act]")) flip(); };
    });
  }

  function initSortables() {
    sortables.forEach((s) => s.destroy()); sortables = [];
    const canvas = document.getElementById("canvas"), libList = document.getElementById("libList");
    const sync = () => { W().order = Array.from(canvas.children).map((el) => el.dataset.id).filter(Boolean); save(); setTimeout(renderLists, 0); };
    sortables.push(Sortable.create(canvas, { group: { name: "m", pull: true, put: true }, handle: ".handle", animation: 160, touchStartThreshold: 3,
      onAdd: (e) => { log("add", { id: e.item.dataset.id, index: e.newIndex, method: "drag" }); sync(); },
      onUpdate: (e) => { log("move", { id: e.item.dataset.id, from: e.oldIndex, to: e.newIndex }); sync(); },
      onRemove: (e) => { const id = e.item.dataset.id; if (isCustom(id)) { delete W().custom[id]; delete W().notes[id]; } log("remove", { id, method: "drag" }); sync(); } }));
    sortables.push(Sortable.create(libList, { group: { name: "m", pull: true, put: true }, sort: false, animation: 160, filter: ".no-drag", preventOnFilter: false, disabled: mobileLayout.matches }));
  }

  function openNote(id) {
    const w = W(), m = themeOf(S.themeId).modules.find((x) => x.id === id);
    const wrap = document.createElement("div"); wrap.className = "dlg-mask";
    wrap.innerHTML = `<div class="dlg"><h4>关于「${esc(m.name)}」</h4><div class="hint">为什么放它、为什么放在这里？或者哪里不好？</div>
      <textarea id="nt" placeholder="随便写一句">${esc(w.notes[id] || "")}</textarea>
      <div class="quick">${NOTE_QUICK.map((q) => `<button data-q="${q}">${q}</button>`).join("")}</div>
      <div class="actions-row" style="justify-content:flex-end"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">保存</button></div></div>`;
    document.body.appendChild(wrap);
    const nt = wrap.querySelector("#nt"); nt.focus();
    wrap.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => { nt.value = nt.value ? nt.value + "；" + b.dataset.q : b.dataset.q; });
    wrap.onclick = (e) => {
      if (e.target === wrap || e.target.dataset.x === "cancel") wrap.remove();
      if (e.target.dataset.x === "ok") { const v = nt.value.trim(); if (v) w.notes[id] = v; else delete w.notes[id]; log("note", { id }); save(); wrap.remove(); renderLists(); }
    };
  }

  // ---------- 页面：会发给谁 ----------
  function viewRecipients() {
    const sel = new Set(S.recipients);
    $app.innerHTML = `<div class="page">
      <span class="step-tag">第 4 步 / 共 4 步</span>
      <h1>这份纪要，您通常会发给哪些人？</h1>
      <p class="sub">可多选。</p>
      <div class="opts" id="rc">${RECIPIENTS.concat(["其他"]).map((v) => `<button class="opt ${sel.has(v) ? "on" : ""}" data-v="${v}"><span class="chk"></span><span class="t">${v}</span></button>`).join("")}
        <button class="opt ${sel.has(NO_SEND) ? "on" : ""}" data-v="${NO_SEND}"><span class="chk"></span><span class="t">${NO_SEND}</span></button></div>
      <div class="field" id="otherBox" style="margin-top:12px;display:${sel.has("其他") ? "block" : "none"}"><input type="text" id="other" maxlength="40" placeholder="请填写会发给谁" value="${esc(S.recipientOther)}" /></div>
      <div class="field" style="margin-top:22px"><label class="lbl">关于理想的纪要，还有什么想说的吗？（选填）</label>
        <textarea class="custom-ta" id="cm" placeholder="比如：最希望 AI 帮您做什么、现在的纪要最让您头疼的地方……">${esc(S.comment)}</textarea></div>
      <button class="btn primary block" id="next" ${sel.size ? "" : "disabled"}>提交，生成我的结果</button>
      <div class="actions-row"><button class="btn ghost" id="back">← 返回修改纪要</button></div>
    </div>`;
    const sync = () => { $app.querySelectorAll("#rc .opt").forEach((b) => b.classList.toggle("on", sel.has(b.dataset.v))); document.getElementById("otherBox").style.display = sel.has("其他") ? "block" : "none"; document.getElementById("next").disabled = !sel.size; };
    $app.querySelectorAll("#rc .opt").forEach((b) => b.onclick = () => {
      const v = b.dataset.v;
      if (sel.has(v)) sel.delete(v); else { if (v === NO_SEND) sel.clear(); else sel.delete(NO_SEND); sel.add(v); }
      sync();
    });
    document.getElementById("back").onclick = () => { S.recipients = Array.from(sel); S.step = "compose"; W().endedAt = 0; save(); route(); };
    document.getElementById("next").onclick = () => {
      S.recipients = Array.from(sel); S.recipientOther = sel.has("其他") ? document.getElementById("other").value.trim() : "";
      S.comment = document.getElementById("cm").value.trim(); if (!W().endedAt) W().endedAt = now();
      S.finishedAt = now(); S.step = "done";
      const r = toResult(S); const done = readLS(DONE_KEY, []).filter((x) => x.id !== r.id); done.push(r);
      localStorage.setItem(DONE_KEY, JSON.stringify(done)); localStorage.removeItem(DRAFT_KEY);
      viewResult(r, false);
    };
  }

  // ---------- 页面：结果 ----------
  function viewResult(r, fromHistory) {
    $app.innerHTML = `<div class="page result-page">
      <h1>🎉 完成了，谢谢您！</h1>
      <p class="sub">最后一步：请把结果发给研究员。<b>两种方式任选其一</b>（都发更好）：</p>
      <div class="send-box">
        <button class="btn primary block" id="img">① 生成结果图片</button>
        <div class="hint" style="margin:6px 0 12px">生成后长按图片保存或直接转发给研究员</div>
        <button class="btn block" id="txt">② 复制结果文字</button>
        <div class="hint" style="margin-top:6px">复制后在聊天窗口粘贴发送即可（含结果码，方便研究员汇总）</div>
      </div>
      <h3 class="rc-label">您的结果预览</h3>
      ${resultCard(r)}
      <div class="actions-row"><button class="btn ghost" id="restart">${fromHistory ? "← 返回" : "再拼一份（换个主题）"}</button></div>
    </div>`;
    document.getElementById("txt").onclick = () => copyText(resultText(r));
    document.getElementById("img").onclick = async (e) => {
      const btn = e.currentTarget; btn.disabled = true; btn.textContent = "正在生成…";
      try { const url = await makeImage(document.getElementById("shot")); showImage(url, `理想纪要_${r.p}_${r.id}.png`); }
      catch (err) { console.error(err); toast("图片生成失败，请改用“复制结果文字”或截图"); }
      btn.disabled = false; btn.textContent = "① 生成结果图片";
    };
    document.getElementById("restart").onclick = () => { S = null; if (!fromHistory && r) { S = newSession(r.p, r.g, true); S.usualDevice = r.ud; S.actualDevice = detectDevice(); S.targetDevice = r.ud === "两者都差不多" ? S.actualDevice : r.ud; S.deviceMismatch = S.targetDevice !== S.actualDevice; S.step = "theme"; save(); route(); } else viewStart(); };
    window.scrollTo(0, 0);
  }

  // ---------- 研究员页 ?admin=1 ----------
  function stats(list) {
        const rows = [];
    THEMES.forEach((t) => {
      ["手机", "电脑", "全部"].forEach((dev) => {
        const subset = list.filter((r) => r.th === t.id && (dev === "全部" || r.ad === dev));
        if (!subset.length) return;
        // 5 张空白卡合并为一行统计：用了任意一张即算选中，位置取每张的位置
        t.modules.filter((m) => !isCustom(m.id) || m.id === "custom1").forEach((m) => {
          const cus = isCustom(m.id);
          const picked = subset.filter((r) => (cus ? r.o.some(isCustom) : r.o.includes(m.id)));
          const pos = cus ? [].concat(...picked.map((r) => r.o.map((id, i) => (isCustom(id) ? i + 1 : 0)).filter(Boolean))) : picked.map((r) => r.o.indexOf(m.id) + 1);
          const top3 = cus ? subset.filter((r) => r.o.slice(0, 3).some(isCustom)).length : pos.filter((p) => p <= 3).length;
          rows.push({ theme: t.name, dev, n: subset.length, mod: cus ? "空白卡（自己写，合计）" : m.name, cat: m.cat,
            rate: Math.round((picked.length / subset.length) * 100), top3: Math.round((top3 / subset.length) * 100),
            avg: pos.length ? (pos.reduce((a, b) => a + b, 0) / pos.length).toFixed(1) : "—" });
        });
      });
    });
    return rows;
  }
  function toCsv(list) {
    const head = ["结果编号", "称呼", "平时方式", "平时看纪要设备", "作答设备", "设备不一致", "主题", "会发给", "会发给-其他", "用时(秒)", "模块数", "顺序", "未选", "备注", "空白卡数", "空白卡内容", "其他想法", "AI问答点击", "排序拖动次数", "提交时间"];
    const rows = [head];
    list.forEach((r) => { const t = themeOf(r.th); if (!t) return; const nm = (id) => (t.modules.find((m) => m.id === id) || {}).name || id;
      const nmPos = (id) => (isCustom(id) ? "空白卡「" + (customOf(r, id) || "未填写") + "」" : nm(id));
      rows.push([r.id, r.p, groupOf(r.g).label, r.ud, r.ad, r.mm ? "是" : "否", t.name, r.r.join("、"), r.ro, r.sec, r.o.length, r.o.map(nmPos).join(" > "),
        t.modules.filter((m) => !r.o.includes(m.id) && !isCustom(m.id)).map((m) => m.name).join("、"), Object.keys(r.n).map((id) => nmPos(id) + "：" + r.n[id]).join("；"),
        r.o.filter(isCustom).length, r.o.map((id, i) => (isCustom(id) ? `第${i + 1}位：${customOf(r, id) || "（未填写）"}` : "")).filter(Boolean).join("；"), r.cm, r.qa, r.mv, fmtTime(r.ft)]); });
    return "\ufeff" + rows.map((x) => x.map((c) => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`).join(",")).join("\n");
  }
  function statsCsv(list) {
    const rows = [["主题", "作答设备", "样本数", "模块", "类别", "被选率%", "进入前三%", "平均位置"]];
    stats(list).forEach((s) => rows.push([s.theme, s.dev, s.n, s.mod, s.cat, s.rate, s.top3, s.avg]));
    return "\ufeff" + rows.map((x) => x.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  }
  function viewAdmin() {
    const list = readLS(COLLECT_KEY, []);
    const st = stats(list).filter((s) => s.dev === "全部");
    $app.innerHTML = `<div class="page wide">
      <span class="step-tag">研究员页</span>
      <h1>结果汇总</h1>
      <p class="sub">${FILE_MODE ? "导入的结果保存在这台电脑的当前浏览器里。请固定用同一台电脑、同一个浏览器打开本文件，并定期导出备份；不要改文件名或移动文件位置。" : "本页数据只保存在你当前这台设备的浏览器里，请定期导出备份。"}</p>
      <div style="display:${FILE_MODE ? "none" : "block"}"><h3>① 生成专属链接（可选）</h3>
      <p class="hint">带称呼和分组的链接，受访者打开后跳过第一页，结果也能准确对应到人。不生成时，直接发通用链接即可。</p>
      <div class="admin-row"><input type="text" id="lp" placeholder="受访者称呼/编号，如 D03" />
        <select id="lg">${GROUPS.map((g) => `<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select>
        <button class="btn primary" id="mk">生成并复制</button><button class="btn" id="mk0">复制通用链接</button></div>
      <div class="url" id="lout" style="margin-top:6px"></div>
      </div>

      <h3>${FILE_MODE ? "①" : "②"} 导入受访者发来的结果文字</h3>
      <p class="hint">把受访者发来的整段文字（含“IM2:”开头的结果码）粘贴进来，可一次粘贴多段。</p>
      <textarea class="custom-ta" id="imp" style="min-height:110px" placeholder="粘贴在这里"></textarea>
      <div class="actions-row" style="margin-top:8px"><button class="btn primary" id="doImp">导入</button></div>

      <h3>${FILE_MODE ? "②" : "③"} 已导入的结果（${list.length}）</h3>
      <div class="actions-row" style="margin-top:0;margin-bottom:12px">
        <button class="btn" id="csv" ${list.length ? "" : "disabled"}>导出明细 CSV</button>
        <button class="btn" id="scsv" ${list.length ? "" : "disabled"}>导出模块统计 CSV（分主题×设备）</button>
        <button class="btn" id="json" ${list.length ? "" : "disabled"}>导出 JSON 备份</button>
        <button class="btn ghost" id="clear" style="color:#e5484d">清空</button></div>
      ${list.length ? `<div class="tbl-scroll"><table class="admin-table"><thead><tr><th>称呼</th><th>平时方式</th><th>设备（平时→作答）</th><th>主题</th><th>会发给</th><th>纪要顺序</th><th></th></tr></thead><tbody>
        ${list.slice().reverse().map((r) => { const t = themeOf(r.th) || { modules: [], name: "?" }; const nm = (id) => (t.modules.find((m) => m.id === id) || {}).name || id;
          return `<tr><td>${esc(r.p)}</td><td>${esc(groupOf(r.g).label)}</td><td>${esc(r.ud)}→${esc(r.ad)}${r.mm ? " ⚠️" : ""}</td><td>${esc(t.name)}</td><td>${esc(r.r.join("、"))}</td><td>${esc(r.o.map(nm).join(" > "))}</td>
          <td style="white-space:nowrap"><button class="link" data-view="${r.id}">查看</button>　<button class="link" data-del="${r.id}" style="color:#e5484d">删除</button></td></tr>`; }).join("")}
      </tbody></table></div>
      <h3>模块被选情况（全部设备合计，分设备请导出统计 CSV）</h3>
      <div class="tbl-scroll"><table class="admin-table"><thead><tr><th>主题</th><th>样本</th><th>模块</th><th>类别</th><th>被选率</th><th>进入前三</th><th>平均位置</th></tr></thead><tbody>
        ${st.map((s) => `<tr><td>${esc(s.theme)}</td><td>${s.n}</td><td>${esc(s.mod)}</td><td>${s.cat}</td><td>${s.rate}%</td><td>${s.top3}%</td><td>${s.avg}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="hint">暂无结果</div>`}
      <div id="detail"></div>
    </div>`;
    const lout = document.getElementById("lout");
    document.getElementById("mk").onclick = () => { const p = document.getElementById("lp").value.trim(); if (!p) { toast("先填称呼/编号"); return; } const u = linkFor({ pid: p, group: document.getElementById("lg").value }); lout.textContent = u; copyText(u).then(() => toast("链接已复制")); };
    document.getElementById("mk0").onclick = () => { const u = baseUrl(); lout.textContent = u; copyText(u).then(() => toast("链接已复制")); };
    document.getElementById("doImp").onclick = () => {
      const got = decodeAll(document.getElementById("imp").value);
      if (!got.length) { toast("没有识别到结果码"); return; }
      const cur = readLS(COLLECT_KEY, []); let add = 0, upd = 0;
      got.forEach((r) => { const i = cur.findIndex((x) => x.id === r.id); if (i >= 0) { cur[i] = r; upd++; } else { cur.push(r); add++; } });
      localStorage.setItem(COLLECT_KEY, JSON.stringify(cur)); toast(`新增 ${add} 条${upd ? "，更新 " + upd + " 条" : ""}`); viewAdmin();
    };
    const day = new Date().toISOString().slice(0, 10);
    document.getElementById("csv").onclick = () => download(`理想纪要调研_明细_${day}.csv`, toCsv(list), "text/csv;charset=utf-8");
    document.getElementById("scsv").onclick = () => download(`理想纪要调研_模块统计_${day}.csv`, statsCsv(list), "text/csv;charset=utf-8");
    document.getElementById("json").onclick = () => download(`理想纪要调研_备份_${day}.json`, JSON.stringify(list, null, 2), "application/json");
    document.getElementById("clear").onclick = async () => { if (await ask("确定清空本设备上的全部已导入结果？建议先导出备份。", "清空", true)) { localStorage.removeItem(COLLECT_KEY); viewAdmin(); } };
    $app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => { if (!(await ask("删除这条结果？", "删除", true))) return; localStorage.setItem(COLLECT_KEY, JSON.stringify(list.filter((x) => x.id !== b.dataset.del))); viewAdmin(); });
    $app.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => { const r = list.find((x) => x.id === b.dataset.view); const d = document.getElementById("detail"); d.innerHTML = `<h3>结果详情：${esc(r.p)}</h3><div style="max-width:760px">${resultCard(r)}</div>`; d.scrollIntoView({ behavior: "smooth" }); });
  }

  // ---------- 路由 ----------
  function route() {
    if (!S) return viewStart();
    ({ device: viewDevice, switch: viewSwitch, theme: viewTheme, intro: viewIntro, compose: viewCompose, recipients: viewRecipients }[S.step] || viewStart)();
    window.scrollTo(0, 0);
  }
  mobileLayout.addEventListener && mobileLayout.addEventListener("change", () => { if (S && S.step === "compose") viewCompose(); });

  const qs = new URLSearchParams(location.search);
  if (qs.get("admin") || window.IM_ADMIN) viewAdmin();
  else if (qs.get("pid") && qs.get("group")) {
    const draft = readLS(DRAFT_KEY, null);
    if (draft && draft.pid === qs.get("pid") && draft.step !== "device") { S = draft; route(); }
    else {
      S = newSession(qs.get("pid"), qs.get("group"), true);
      S.usualDevice = qs.get("dev") || "";
      S.targetDevice = S.usualDevice === "两者都差不多" ? S.actualDevice : S.usualDevice;
      S.deviceMismatch = !!S.targetDevice && S.targetDevice !== S.actualDevice;
      S.step = S.targetDevice ? "theme" : "device"; save(); route();
    }
  } else viewStart();
})();

</script>
